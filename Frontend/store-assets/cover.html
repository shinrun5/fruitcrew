<!doctype html>
<!-- App Store cover screenshot (the first one people see). Same look as the
     landing page hero: cream, yellow motto pill, Baloo headline with a coral
     highlight, the app in a tilted ink-framed phone with stickers.
     Laid out at 440 × 956 CSS px; rendered at 3× = 1320 × 2868 (iPhone 6.9").
     cover.html?play is the Google Play version: 432 × 768 at 2.5× = 1080 × 1920. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2b4d;
        --cream: #fff8ec;
        --paper: #fff;
        --green: #5fbe6b;
        --coral: #ff6f61;
        --sky: #52c7e8;
        --yellow: #f5c445;
        --grape: #9b7ede;
        --muted: #7a6e8c;
        --heading: "Baloo 2", system-ui, sans-serif;
        --body: "Nunito", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 440px; height: 956px; overflow: hidden; }
      body { background: var(--cream); color: var(--ink); font-family: var(--body); position: relative; }

      /* confetti in the brand colors */
      .dot { position: absolute; border: 2.5px solid var(--ink); border-radius: 50%; }
      .dot.a { width: 18px; height: 18px; background: var(--sky); right: 34px; top: 58px; }
      .dot.b { width: 12px; height: 12px; background: var(--coral); right: 78px; top: 104px; }
      .dot.c { width: 14px; height: 14px; background: var(--grape); left: 22px; top: 470px; }
      .dot.d { width: 16px; height: 16px; background: var(--yellow); right: 20px; top: 430px; }

      /* green field the phone stands in */
      .field {
        position: absolute;
        left: -40px;
        right: -40px;
        top: 560px;
        bottom: -40px;
        background: var(--green);
        border-top: 3px solid var(--ink);
        border-radius: 50% 50% 0 0 / 70px 70px 0 0;
      }

      .top { position: relative; padding: 40px 30px 0; }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .brand svg { width: 44px; height: 44px; }
      .brand span { font-family: var(--heading); font-weight: 800; font-size: 27px; line-height: 1; padding-top: 4px; }
      .motto {
        display: inline-block;
        font-family: var(--heading);
        font-weight: 800;
        font-size: 15px;
        background: var(--yellow);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        padding: 3px 14px 1px;
        box-shadow: 3px 3px 0 var(--ink);
        transform: rotate(-2deg);
        margin-bottom: 14px;
      }
      h1 {
        font-family: var(--heading);
        font-weight: 800;
        font-size: 43px;
        line-height: 1.02;
        letter-spacing: -0.5px;
        margin: 0 0 12px;
      }
      h1 em { font-style: normal; color: var(--coral); }
      .sub { font-size: 17px; font-weight: 700; color: var(--muted); line-height: 1.35; margin: 0; max-width: 360px; }

      .stage { position: absolute; left: 0; right: 0; top: 358px; display: flex; justify-content: center; }
      .phone {
        position: relative;
        width: 292px;
        border: 3px solid var(--ink);
        border-radius: 46px;
        background: var(--ink);
        padding: 9px;
        box-shadow: 9px 9px 0 var(--ink);
        transform: rotate(2.5deg);
      }
      .screen { border-radius: 37px; overflow: hidden; background: var(--paper); }
      .status { position: relative; height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 0 28px; font-weight: 800; font-size: 13px; }
      .island { position: absolute; left: 50%; top: 9px; width: 70px; height: 21px; margin-left: -35px; border-radius: 999px; background: var(--ink); }
      .icons { display: flex; align-items: center; gap: 4px; transform: scale(0.85); transform-origin: right center; }
      .screen img { display: block; width: 100%; height: auto; }

      .sticker {
        position: absolute;
        font-family: var(--heading);
        font-weight: 800;
        font-size: 15px;
        background: var(--paper);
        border: 2.5px solid var(--ink);
        border-radius: 15px;
        padding: 6px 13px 4px;
        box-shadow: 3px 3px 0 var(--ink);
        white-space: nowrap;
        z-index: 2;
      }
      .sticker.a { left: 16px; top: 440px; transform: rotate(-6deg); }
      .sticker.b { right: 14px; top: 676px; transform: rotate(5deg); background: var(--yellow); }
      .sticker.c { left: 22px; top: 911px; transform: rotate(-3deg); background: var(--coral); color: #fff; }

      /* Google Play: 9:16, so shorter — tighter header, phone moved up */
      .play, .play body { width: 432px; height: 768px; }
      .play .top { padding-top: 30px; }
      .play .brand { margin-bottom: 14px; }
      .play h1 { font-size: 40px; }
      .play .sub { font-size: 16px; }
      .play .stage { top: 318px; }
      .play .field { top: 500px; }
      .play .dot.c { top: 420px; }
      .play .dot.d { top: 380px; }
      .play .sticker.a { top: 398px; }
      .play .sticker.b { top: 636px; }
      .play .sticker.c { display: none; }
      .play .sub { max-width: 330px; }
      /* an Android-style punch-hole camera, not the iPhone's island */
      .play .island { width: 13px; height: 13px; margin-left: -6.5px; top: 14px; }
    </style>
    <script>if (location.search.includes('play')) document.documentElement.classList.add('play')</script>
  </head>
  <body>
    <span class="dot a"></span><span class="dot b"></span><span class="dot c"></span><span class="dot d"></span>
    <div class="field"></div>

    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#FFF8EC" stroke="#3A2B4D" stroke-width="3" />
          <g transform="translate(32 33) scale(1.06) translate(-32 -33)">
            <ellipse cx="40" cy="15" rx="7" ry="4.5" fill="#5FBE6B" stroke="#3A2B4D" stroke-width="2.2" transform="rotate(-20 40 15)" />
            <rect x="29.5" y="8" width="5" height="11" rx="2.5" fill="#8B5E3C" stroke="#3A2B4D" stroke-width="2.2" />
            <circle cx="32" cy="37" r="22" fill="#FF6F61" stroke="#3A2B4D" stroke-width="2.6" />
            <circle cx="24" cy="34" r="2.6" fill="#3A2B4D" />
            <circle cx="40" cy="34" r="2.6" fill="#3A2B4D" />
            <ellipse cx="21" cy="41" rx="4.2" ry="2.6" fill="#FF9E90" opacity="0.6" />
            <ellipse cx="43" cy="41" rx="4.2" ry="2.6" fill="#FF9E90" opacity="0.6" />
            <path d="M25 42 Q32 47 39 42" fill="none" stroke="#3A2B4D" stroke-width="2.2" stroke-linecap="round" />
          </g>
        </svg>
        <span>Fruit Crew</span>
      </div>
      <span class="motto">🍎 Staff scheduling, simplified</span>
      <h1>Your week's schedule, <em>drafted for you.</em></h1>
      <p class="sub">Swaps, availability, time off and team chat, all from your phone.</p>
    </div>

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="status">
            <span>9:41</span>
            <span class="island"></span>
            <span class="icons" aria-hidden="true">
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#3a2b4d" /><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#3a2b4d" /><rect x="10" y="3" width="3" height="9" rx="1" fill="#3a2b4d" /><rect x="15" y="0" width="3" height="12" rx="1" fill="#3a2b4d" /></svg>
              <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0z" fill="#3a2b4d" /><path d="M3.4 6.8a6.5 6.5 0 0 1 9.2 0" stroke="#3a2b4d" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M1 4.3a10 10 0 0 1 14 0" stroke="#3a2b4d" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
              <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" stroke="#3a2b4d" stroke-width="1.5" fill="none" /><rect x="2.5" y="2.5" width="18" height="7" rx="1.6" fill="#3a2b4d" /><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#3a2b4d" /></svg>
            </span>
          </div>
          <img src="screenshots/ios67-4-my-shifts.png" alt="" />
        </div>
      </div>
    </div>

    <span class="sticker a">✓ Schedule posted</span>
    <span class="sticker b">🤝 Swap approved</span>
    <span class="sticker c">⏰ Shift in 1 hour</span>
  </body>
</html>
